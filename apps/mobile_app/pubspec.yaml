name: stepstones
resolution: workspace
description: A meditation timer and chanting application.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.9.0+4

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  material_ui: ^1.1.1
  cupertino_icons: ^1.0.2
  intl: ^0.20.3

  # System and architectural  
  logger: ^2.0.2+1
  go_router: ^18.0.0
  provider: ^6.0.5
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.5
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  flutter_soloud: ^4.0.5

  # Internal packages
  firebase_provider: ^1.0.0
  core: ^0.0.1
  donate: ^0.0.1
  home: ^0.0.1
  auth: ^0.0.1
  profile: ^0.0.1
  timer: ^0.0.1
  chanting: ^0.0.1
  session: ^0.0.1
  social: ^0.0.1
  stats: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true # For generating localizations?
  uses-material-design: true
