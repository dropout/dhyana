name: particle_field
resolution: workspace
description: Particle system widget with emitters, force fields, vector fields and batched rendering.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  rnd: 0.2.0
  vector_math: ^2.1.4
  flutter_gpu:
    sdk: flutter

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.0.0
  test: ^1.24.0

flutter:
  assets:
    - assets/particle.shaderbundle
