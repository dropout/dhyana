name: core
description: "A new Flutter package project."
resolution: workspace
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  material_ui: ^1.1.0
  get_it: ^9.2.1
  go_router: ^18.0.0
  provider: ^6.1.5+1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.4
  
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_soloud: ^4.1.7
  gaimon: ^1.5.0

  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.3.0
  image_picker: ^1.2.3

  vector_math: ^2.4.2
  flutter_shaders: ^0.1.3
  
  shared_preferences: ^2.0.5  

  google_mlkit_image_labeling: ^0.16.1

  firebase_provider: ^1.0.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  wakelock_plus: ^1.7.0
  image: ^4.9.2

  faker: ^2.2.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0


  flutter_volume_listener:
    git:
      url: git@github.com:dropout/flutter_volume_listener.git
  flutter_mindful_minutes:
    git:
      url: git@github.com:dropout/flutter_mindful_minutes.git


  url_launcher: ^6.3.2
  blurhash_dart: ^1.2.1
  logger: ^2.7.0
  cached_network_image: ^4.0.0
  flutter_blurhash: ^0.9.1
  package_info_plus: ^10.2.1
  flutter_animate: ^4.5.2
  dart_geohash: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  freezed: ^4.0.1
  json_serializable: ^6.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  assets:
  - assets/sounds/
  - assets/images/
  - assets/haptics/
  - assets/gantman_nswf_110.tflite
  
  shaders:
    - shaders/gradient_flow.frag
    - shaders/linear_gradient_mask.frag
    - shaders/test.frag

  fonts:
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-Black.ttf
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-Bold.ttf
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-ExtraBold.ttf
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-ExtraLight.ttf
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-Light.ttf
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-Medium.ttf
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-Regular.ttf
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-SemiBold.ttf
        - asset: assets/fonts/Roboto_Slab/static/RobotoSlab-Thin.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/Roboto_Condensed/RobotoCondensed-Bold.ttf
        - asset: assets/fonts/Roboto_Condensed/RobotoCondensed-BoldItalic.ttf
        - asset: assets/fonts/Roboto_Condensed/RobotoCondensed-Italic.ttf
        - asset: assets/fonts/Roboto_Condensed/RobotoCondensed-Light.ttf
        - asset: assets/fonts/Roboto_Condensed/RobotoCondensed-LightItalic.ttf
        - asset: assets/fonts/Roboto_Condensed/RobotoCondensed-Regular.ttf    
