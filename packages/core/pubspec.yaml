name: core
description: "Shared foundational services, app architecture, and cross-feature utilities for the application."
resolution: workspace
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Core app support
  assets: ^0.0.1
  drift: ^2.34.4
  firebase_provider: ^1.0.0
  get_it: ^9.2.1
  go_router: ^18.0.0
  logger: ^2.7.0
  material_ui: ^1.1.0
  package_info_plus: ^10.2.1
  provider: ^6.1.5+1
  shared_preferences: ^2.0.5

  # State management and data / serialization
  bloc_test: ^10.0.0
  faker: ^2.2.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  hydrated_bloc: ^11.0.0
  json_annotation: ^4.12.0
  mocktail: ^1.0.5

  # Forms, validation, and geolocation
  dart_geohash: ^2.1.0
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.3.0
  url_launcher: ^6.3.2

  # Media / UI / graphics
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  blurhash_dart: ^1.2.1
  cached_network_image: ^4.0.0
  flutter_animate: ^4.5.2
  flutter_blurhash: ^0.9.1
  flutter_litert: ^3.8.0
  flutter_shaders: ^0.1.3
  flutter_soloud: ^4.1.7
  flutter_volume_listener:
    git:
      url: git@github.com:dropout/flutter_volume_listener.git
  gaimon: ^1.5.0
  image: ^4.9.2
  image_picker: ^1.2.3
  vector_math: ^2.4.2
  wakelock_plus: ^1.7.0
  flutter_map: ^8.3.2

  # Feature-specific integrations
  flutter_mindful_minutes:
    git:
      url: git@github.com:dropout/flutter_mindful_minutes.git


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  freezed: ^4.0.1
  json_serializable: ^6.9.0

flutter:
  generate: true
