name: mobile_app
publish_to: none
environment: 
  sdk: '>=3.10.0 <4.0.0'

workspace:
  - apps/mobile_app
  - packages/firebase_provider
  - packages/core  
  - packages/modules/app_events
  - packages/modules/auth
  - packages/modules/donate
  - packages/modules/home
  - packages/modules/practice/timer
  - packages/modules/practice/session
  - packages/modules/practice/chanting
  - packages/modules/profile
  - packages/modules/social
  - packages/modules/stats
  - packages/particle_field
  - packages/bar_chart

dev_dependencies:
  melos: ^7.5.1

melos:
  ide:
    intellij:
      enabled: false
  bootstrap:  
    runPubGetInParallel: false
    usePubspecOverrides: true
    hooks:
      post: melos codegen

  scripts:
    clean:
      description: Run flutter clean in all packages
      run: melos exec -c 1 -- "flutter clean"
    pub:get:
      description: Fetch dependencies for all packages
      run: melos exec -c 1 -- "flutter pub get"
    format:
      description: Format Dart code in all packages
      run: melos exec -c 5 -- "dart format --line-length 120 lib test"
    analyze:
      description: Analyze Dart code in all packages
      run: melos exec -c 5 -- "flutter analyze"
    test:
      description: Run tests in all packages
      run: melos exec -c 1 -- "flutter test"
      failFast: true

    # Code generation
    codegen:
      description: Run code generation via build_runner on all packages
      run: melos exec -c 1 -- "dart run build_runner build --delete-conflicting-outputs"
    codegen:l10n:
      description: Run code generation for localization
      run: melos exec -c 1 -- "flutter gen-l10n"
    codegen:watch:
      description: Watch for changes and run code generation
      run: melos exec -c 1 -- "dart run build_runner watch --delete-conflicting-outputs"

    # Staging builds
    build:staging:
      description: Build staging release for mobile app (Android and iOS)
      run: |
        melos run build:android:staging && melos run build:ios:staging
    build:android:staging:
      description: Build staging release for mobile app (Android)
      run: |
        cd apps/mobile_app && flutter build appbundle --release --flavor staging -t lib/main_staging.dart && cd ../..
    build:ios:staging:
      description: Build iOS IPA (staging) for mobile app
      run: |
        cd apps/mobile_app && flutter build ipa --release --flavor staging -t lib/main_staging.dart && cd ../..
    release:staging:
      description: Run full staging release workflow for mobile app
      run: |
        cd apps/mobile_app && ./scripts/release_staging.sh && cd ../..
    release:staging:bump:
      description: Bump build number for mobile app staging release
      run: |
        cd apps/mobile_app && ./scripts/bump_build_number.sh && cd ../..

    # Production builds
    build:production:
      description: Build production release for mobile app (Android and iOS)
      run: |
        melos run build:android:production && melos run build:ios:production
    build:android:production:
      description: Build production release for mobile app (Android)
      run: |
        cd apps/mobile_app && flutter build appbundle --release --flavor production -t lib/main_production.dart && cd ../..
    build:ios:production:
      description: Build iOS IPA (production) for mobile app
      run: |
        cd apps/mobile_app && flutter build ipa --release --flavor production -t lib/main_production.dart && cd ../..

      